<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devices-width,initial-scale=1.0">
    <title>Registro de Acesso</title>
</head>
<body>

    <h1>Registro de acesso</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p}}

        <button type="submit">Registrar Acesso</button>
    </form>
    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}

   
</body>
</html>
