<!-- Carrega a biblioteca de arquivos estáticos do Django (CSS, imagens, JS) -->
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Define o padrão de acentuação e adaptação para celular/computador -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar QR Code</title>
    <!-- Conecta o arquivo de estilo CSS da página -->
    <link rel="stylesheet" href="{% static 'css/gerar_qr.css'%}">
</head>
<body>

<!-- Título principal que aparece no topo da página -->
<h2>Gerar QR Code do Aluno</h2>

<!-- Formulário que envia a matrícula digitada via método POST para o Django -->
<form method="POST">
    <!-- Token de segurança obrigatório do Django contra ataques CSRF -->
    {% csrf_token %}
    
    <!-- Rótulo e campo de texto onde o usuário digita o número da matrícula -->
    <label>Matrícula do Aluno:</label><br>
    <input type="text" name="matricula" required maxlength="20"><br><br>
    
    <!-- Botão que dispara o envio do formulário para gerar o QR Code -->
    <button type="submit">Gerar Código</button>
</form>

<!-- Bloco condicional: só aparece na tela depois que um QR Code for gerado -->
{% if imagem_qr %}
    <!-- Linha horizontal para separar o formulário do resultado -->
    <hr>
    <h3>QR Code Gerado com Sucesso!</h3>
    
    <!-- Exibe o código em texto dentro de uma caixa cinza para facilitar a cópia -->
    <p style="font-size: 18px; background-color: #f0f0f0; padding: 10px; display: inline-block;">
        Código: <strong>{{ codigo_gerado }}</strong>
    </p>
    <br><br>
    
    <!-- Renderiza a imagem PNG do QR Code convertida em texto Base64 -->
    <img src="data:image/png;base64,{{ imagem_qr }}" alt="QR Code do Aluno"><br><br>
    
    <!-- Link estilizado como botão verde para levar direto à tela de validação da guarita -->
    <a href="/validar/" style="background-color: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">
        Ir para a Guarita (Verificar)
    </a>
{% endif %}

</body>
</html>
